name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

  package-windows:
    name: package (windows-x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just (pinned)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install just --version 1.59.0 --locked; then
              break
            fi
            echo "cargo install just failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$(just --version)" = "just 1.59.0"

      - name: Install WiX Toolset v7
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # WiX v7 refuses to build until the OSMF EULA is accepted (WIX7015).
      # Read https://wixtoolset.org/osmf/ before accepting it.
      - name: Accept WiX OSMF EULA
        shell: pwsh
        run: wix eula accept wix7

      - name: Fetch pinned Wintun
        run: just fetch-wintun

      - name: Build MSI and portable zip
        run: just dist-windows

      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $expected = @{
            'aevan.exe'     = 'Aevan VPN client'
            'aevand.exe'    = 'Aevan daemon'
            'aevan-gui.exe' = 'Aevan GUI'
          }
          foreach ($name in $expected.Keys) {
            $info = (Get-Item "target/release/$name").VersionInfo
            if ($info.ProductName -ne 'Aevan') { throw "$name ProductName is '$($info.ProductName)'" }
            if ($info.FileDescription -ne $expected[$name]) { throw "$name FileDescription is '$($info.FileDescription)'" }
            if ($info.FileVersion -ne $version) { throw "$name FileVersion is '$($info.FileVersion)', expected '$version'" }
            if ($info.OriginalFilename -ne $name) { throw "$name OriginalFilename is '$($info.OriginalFilename)'" }
          }

      - name: Validate MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/dist/*.msi | Select-Object -First 1
          wix msi validate $msi.FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aevan-windows-x64
          path: |
            target/dist/*.msi
            target/dist/*.zip
          if-no-files-found: error

  package-macos:
    name: package (macos-universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just (pinned)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install just --version 1.59.0 --locked; then
              break
            fi
            echo "cargo install just failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$(just --version)" = "just 1.59.0"

      - name: Build universal .app and .pkg
        run: just dist-macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aevan-macos-universal
          path: |
            target/dist/*.pkg
            target/dist/Aevan.app
          if-no-files-found: error

  package-linux:
    name: package (linux-x64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just (pinned)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install just --version 1.59.0 --locked; then
              break
            fi
            echo "cargo install just failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$(just --version)" = "just 1.59.0"

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build Linux tarball
        run: just dist-linux

      - name: Build Debian package
        run: just deb

      - name: Inspect Debian package
        run: |
          set -euo pipefail
          deb="$(ls target/dist/aevan_*_amd64.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          for path in \
            ./usr/bin/aevan ./usr/bin/aevand ./usr/bin/aevan-gui \
            ./lib/systemd/system/aevand.service \
            ./usr/share/applications/aevan.desktop \
            ./usr/share/icons/hicolor/64x64/apps/aevan.png \
            ./usr/share/icons/hicolor/128x128/apps/aevan.png \
            ./usr/share/icons/hicolor/256x256/apps/aevan.png \
            ./usr/share/icons/hicolor/512x512/apps/aevan.png \
            ./usr/share/doc/aevan/README ./usr/share/doc/aevan/copyright; do
            dpkg-deb --contents "$deb" | grep -Fq "$path"
          done

      - name: Build RPM package
        run: just rpm

      - name: Inspect RPM package
        run: |
          set -euo pipefail
          rpm_file="$(ls target/dist/aevan-*-1.x86_64.rpm)"
          rpm -qip "$rpm_file"
          rpm -qlp "$rpm_file"
          for path in \
            /usr/bin/aevan /usr/bin/aevand /usr/bin/aevan-gui \
            /lib/systemd/system/aevand.service \
            /usr/share/applications/aevan.desktop \
            /usr/share/icons/hicolor/64x64/apps/aevan.png \
            /usr/share/icons/hicolor/128x128/apps/aevan.png \
            /usr/share/icons/hicolor/256x256/apps/aevan.png \
            /usr/share/icons/hicolor/512x512/apps/aevan.png \
            /usr/share/doc/aevan/README /usr/share/doc/aevan/copyright; do
            rpm -qlp "$rpm_file" | grep -Fxq "$path"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aevan-linux-x64
          path: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
          if-no-files-found: error
