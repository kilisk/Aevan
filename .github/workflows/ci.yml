name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  platform-matrix:
    name: platform-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Fast, toolchain-free gate: the committed matrix must match the
      # capability inventory, and every implemented/stub/absent difference must
      # carry a docs/platform-gaps.toml entry.
      - name: Check the platform capability matrix
        run: python scripts/platform-matrix.py --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

      # Defect 1 proof: a root daemon binds the machine-wide socket, and the
      # normal runner user reaches it through the candidate list.
      - name: Control socket is reachable across UIDs (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo build --bins
          socket="/Library/Application Support/Aevan/aevan.sock"
          sudo rm -rf "/Library/Application Support/Aevan"
          sudo ./target/debug/aevand > /tmp/aevand-ci.log 2>&1 &
          daemon_pid=$!
          for _ in $(seq 1 100); do
            [ -S "$socket" ] && break
            sleep 0.1
          done
          if [ ! -S "$socket" ]; then
            echo "daemon did not create $socket"
            cat /tmp/aevand-ci.log
            exit 1
          fi
          echo "socket: $socket"
          stat -f 'socket mode=%Sp owner=%Su:%Sg path=%N' "$socket"
          stat -f 'dir mode=%Sp owner=%Su:%Sg path=%N' "/Library/Application Support/Aevan"
          ./target/debug/aevan status --json | tee /tmp/aevan-status.json
          grep -F '"endpoint": "/Library/Application Support/Aevan/aevan.sock"' /tmp/aevan-status.json
          test "$(stat -f '%Sp' "$socket")" = "srw-rw-rw-"
          test "$(stat -f '%Sp' "/Library/Application Support/Aevan")" = "drwxr-xr-x"
          sudo pkill -x aevand || true
          wait "$daemon_pid" || true
          sudo rm -rf "/Library/Application Support/Aevan"

      # The smoke example is the first real proof that a device opens on macOS
      # and Linux. It is built unprivileged and run under sudo with the skip
      # escape hatch explicitly removed, so a broken backend fails the job.
      - name: Ensure /dev/net/tun (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [ ! -c /dev/net/tun ]; then
            echo "/dev/net/tun is missing; trying to load the tun module"
            if ! sudo modprobe tun; then
              echo "modprobe tun failed"
            fi
          fi
          if [ ! -c /dev/net/tun ]; then
            echo "/dev/net/tun is still missing; creating the device node (c 10 200)"
            sudo mkdir -p /dev/net
            if ! sudo mknod /dev/net/tun c 10 200; then
              echo "mknod /dev/net/tun failed"
            fi
            sudo chmod 666 /dev/net/tun || true
          fi
          ls -l /dev/net/tun || true

      - name: TUN smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build --example tun_smoke
          unset AEVAN_TUN_SMOKE_ALLOW_SKIP
          if [ ! -c /dev/net/tun ]; then
            echo "::warning::SKIPPED: /dev/net/tun is unavailable on this runner after modprobe tun and mknod c 10 200; the Linux TUN backend cannot be exercised here."
            {
              echo "### TUN smoke (Linux): SKIPPED"
              echo ""
              echo "/dev/net/tun is unavailable after \`modprobe tun\` and \`mknod /dev/net/tun c 10 200\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo env -u AEVAN_TUN_SMOKE_ALLOW_SKIP ./target/debug/examples/tun_smoke

      - name: TUN smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo build --example tun_smoke
          unset AEVAN_TUN_SMOKE_ALLOW_SKIP
          sudo env -u AEVAN_TUN_SMOKE_ALLOW_SKIP ./target/debug/examples/tun_smoke

  package-windows:
    name: package (windows-x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just (pinned)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install just --version 1.59.0 --locked; then
              break
            fi
            echo "cargo install just failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$(just --version)" = "just 1.59.0"

      - name: Install WiX Toolset v7
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # WiX v7 refuses to build until the OSMF EULA is accepted (WIX7015).
      # Read https://wixtoolset.org/osmf/ before accepting it.
      - name: Accept WiX OSMF EULA
        shell: pwsh
        run: wix eula accept wix7

      - name: Fetch pinned Wintun
        run: just fetch-wintun

      - name: Build MSI and portable zip
        run: just dist-windows

      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $expected = @{
            'aevan.exe'     = 'Aevan VPN client'
            'aevand.exe'    = 'Aevan daemon'
            'aevan-gui.exe' = 'Aevan GUI'
          }
          foreach ($name in $expected.Keys) {
            $info = (Get-Item "target/release/$name").VersionInfo
            if ($info.ProductName -ne 'Aevan') { throw "$name ProductName is '$($info.ProductName)'" }
            if ($info.FileDescription -ne $expected[$name]) { throw "$name FileDescription is '$($info.FileDescription)'" }
            if ($info.FileVersion -ne $version) { throw "$name FileVersion is '$($info.FileVersion)', expected '$version'" }
            if ($info.OriginalFilename -ne $name) { throw "$name OriginalFilename is '$($info.OriginalFilename)'" }
          }

      - name: Validate MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/dist/*.msi | Select-Object -First 1
          wix msi validate $msi.FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aevan-windows-x64
          path: |
            target/dist/*.msi
            target/dist/*.zip
          if-no-files-found: error

  package-macos:
    name: package (macos-universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just (pinned)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install just --version 1.59.0 --locked; then
              break
            fi
            echo "cargo install just failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$(just --version)" = "just 1.59.0"

      - name: Build universal .app, .pkg and .dmg
        run: just dist-macos

      # This is the first real proof of the drag-install image. It mounts the
      # DMG read-only, checks the bundle identity and icon, runs the GUI binary,
      # and proves the Applications symlink resolves, then always detaches.
      - name: Validate DMG
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          dmg="target/dist/aevan-${version}-arm64+x86_64.dmg"
          test -f "$dmg"
          ls -lh "$dmg"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          cleanup() {
            hdiutil detach "$mountpoint" || true
            rmdir "$mountpoint" || true
          }
          trap cleanup EXIT

          app="$mountpoint/Aevan.app"
          test -f "$app/Contents/Info.plist"
          echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.github.kilisk.aevan'
          test -f "$app/Contents/Resources/AppIcon.icns"
          echo "AppIcon.icns: present"
          rm -rf /tmp/AppIcon.iconset
          iconutil -c iconset "$app/Contents/Resources/AppIcon.icns" -o /tmp/AppIcon.iconset
          echo "icns sizes: $(ls /tmp/AppIcon.iconset | wc -l | tr -d ' ')"; ls /tmp/AppIcon.iconset
          test "$(ls /tmp/AppIcon.iconset | wc -l)" -ge 8
          if [ -f "$app/Contents/Resources/Assets.car" ]; then
            echo "Assets.car: $(wc -c <"$app/Contents/Resources/Assets.car") bytes (layered icon)"
          else
            echo "Assets.car: absent, flat icns only"
          fi
          "$app/Contents/MacOS/aevan-gui" --version
          test -x "$app/Contents/MacOS/aevand"
          "$app/Contents/MacOS/aevand" --version
          test -L "$mountpoint/Applications"
          echo "Applications symlink: $(readlink "$mountpoint/Applications")"
          test "$(readlink "$mountpoint/Applications")" = "/Applications"
          test -d "$mountpoint/Applications"
          echo "dmg verification passed"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aevan-macos-universal
          path: |
            target/dist/*.pkg
            target/dist/*.dmg
            target/dist/Aevan.app
          if-no-files-found: error

  package-linux:
    name: package (linux-x64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just (pinned)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo install just --version 1.59.0 --locked; then
              break
            fi
            echo "cargo install just failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$(just --version)" = "just 1.59.0"

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build Linux tarball
        run: just dist-linux

      - name: Build Debian package
        run: just deb

      - name: Inspect Debian package
        run: |
          set -euo pipefail
          deb="$(ls target/dist/aevan_*_amd64.deb)"
          ls -l "$deb"
          # Inspect the archive structurally instead of with dpkg-deb: on this
          # image `dpkg-deb --info` fails with "tar subprocess failed with exit
          # status 2" even though ar and tar read the same package cleanly, so the
          # tool is unreliable here and the archive is what we actually verify.
          ar t "$deb" | tee /tmp/members.txt
          grep -qx debian-binary /tmp/members.txt
          control="$(grep -E '^control\.tar' /tmp/members.txt)"
          data="$(grep -E '^data\.tar' /tmp/members.txt)"
          ar p "$deb" "$control" | tar tzf - | sed 's|^\./||' | tee /tmp/control-files.txt
          grep -qx control /tmp/control-files.txt
          ar p "$deb" "$data" | tar tzf - | sed 's|^\./||' | tee /tmp/data-files.txt
          for path in             usr/bin/aevan usr/bin/aevand usr/bin/aevan-gui             lib/systemd/system/aevand.service             usr/share/applications/aevan.desktop             usr/share/icons/hicolor/64x64/apps/aevan.png             usr/share/icons/hicolor/128x128/apps/aevan.png             usr/share/icons/hicolor/256x256/apps/aevan.png             usr/share/icons/hicolor/512x512/apps/aevan.png             usr/share/doc/aevan/README usr/share/doc/aevan/copyright; do
            grep -qx "$path" /tmp/data-files.txt || { echo "missing $path"; exit 1; }
          done
          echo "debian package structure verified"

      - name: Build RPM package
        run: just rpm

      - name: Inspect RPM package
        run: |
          set -euo pipefail
          rpm_file="$(ls target/dist/aevan-*-1.x86_64.rpm)"
          rpm -qip "$rpm_file"
          rpm -qlp "$rpm_file"
          for path in \
            /usr/bin/aevan /usr/bin/aevand /usr/bin/aevan-gui \
            /lib/systemd/system/aevand.service \
            /usr/share/applications/aevan.desktop \
            /usr/share/icons/hicolor/64x64/apps/aevan.png \
            /usr/share/icons/hicolor/128x128/apps/aevan.png \
            /usr/share/icons/hicolor/256x256/apps/aevan.png \
            /usr/share/icons/hicolor/512x512/apps/aevan.png \
            /usr/share/doc/aevan/README /usr/share/doc/aevan/copyright; do
            rpm -qlp "$rpm_file" | grep -Fxq "$path"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aevan-linux-x64
          path: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
          if-no-files-found: error
