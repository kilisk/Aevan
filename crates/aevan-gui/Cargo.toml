[package]
name = "aevan-gui"
description = "Native GUI for aevan; a client of the aevand control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "aevan-gui"
path = "src/main.rs"

[build-dependencies]
png = { workspace = true }
winresource = { workspace = true }

[dependencies]
iced = { workspace = true }
aevan-core = { workspace = true }
aevan-daemon = { workspace = true }
aevan-instance = { workspace = true }
aevan-proto = { workspace = true }
aevan-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

# Windows and Linux use the cross-platform notification backend. macOS uses
# the native UserNotifications framework instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = { workspace = true }

# macOS notifications and LaunchDaemon registration are direct framework calls:
# UserNotifications for UNUserNotificationCenter and ServiceManagement for
# SMAppService. These crates expose the Objective-C bindings; the GUI's
# `#![deny(unsafe_code)]` stays in force everywhere except the two modules that
# opt in locally.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, default-features = false, features = ["std", "NSString", "NSError", "NSBundle", "NSURL"] }
objc2-service-management = { workspace = true }
objc2-user-notifications = { workspace = true }

# Windows: `tao` pumps the hidden tray window's Win32 messages on the tray
# thread; `tray-icon` provides the icon and menu. Linux stays tray-free (no GTK
# or libappindicator dependency).
[target.'cfg(windows)'.dependencies]
tao = { workspace = true }

# macOS uses an NSStatusItem through `tray-icon` on iced's main thread; it must
# not pull in `tao`, which would create a second event loop.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
png = { workspace = true }
tray-icon = { workspace = true }
