# What has actually been run for each capability and platform.
#
# The platform matrix reads this file for its `Verified` column and never
# upgrades a cell from code alone. `state` is one of:
#   verified-live  an actual run on that operating system
#   compile-only   the code builds, but nobody has run it there
#
# `source` names the run: a CI job or a dated user report. The Windows tunnel
# evidence is the live verification recorded in docs/CONNECT.md (2026-11-04).
# The macOS and Linux tun-device entries record the CI smoke proof that the
# device opens. That is a live device run; a full tunnel remains a gap, as
# docs/platform-gaps.toml states.

[[evidence]]
capability = "tun-device"
platform = "windows"
state = "verified-live"
source = "docs/CONNECT.md: live Windows tunnel verification (2026-11-04)"

[[evidence]]
capability = "tun-device"
platform = "macos"
state = "verified-live"
source = "CI job test (macos-latest): tun_smoke opens utun; no full tunnel run"

[[evidence]]
capability = "tun-device"
platform = "linux"
state = "verified-live"
source = "CI job test (ubuntu-latest): tun_smoke opens /dev/net/tun; no full tunnel run"

